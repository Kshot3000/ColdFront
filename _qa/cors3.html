<!DOCTYPE html><html><body><pre id="o"></pre><script>
(async()=>{
 const o=s=>{document.getElementById('o').textContent+=s+'\n';console.log(s)};
 const urls=[
  ['web.scoreboard','https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'],
  ['web.schedule','https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/teams/chicago/schedule'],
  ['web.roster','https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/teams/chicago/roster'],
  ['cdn.scoreboard','https://cdn.espn.com/core/nfl/scoreboard?xhr=1'],
  ['site.api','https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'],
 ];
 for (const [n,u] of urls){
   try{
     const r=await fetch(u);
     const t=await r.text();
     o(n+' '+r.status+' '+t.length+'b '+t.slice(0,50).replace(/\n/g,' '));
   }catch(e){o(n+' FAIL '+e)}
 }
 o('DONE');
})();
</script></body></html>
